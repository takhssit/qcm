<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen blanc en cours — maquette</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F9}
*{box-sizing:border-box}
::selection{background:#FFE45C;color:#172041}
a{color:#172041;text-underline-offset:3px}a:hover{color:#2A3870}
button,a{font-family:inherit}
:focus-visible{outline:3px solid #172041;outline-offset:2px}
.cell{height:14px;border-radius:3px;background:#DDE2EC}
.cell.done{background:#172041}
.cell.flag{background:#FFE45C;box-shadow:inset 0 0 0 1.5px #172041}
.cell.now{background:#FFFFFF;box-shadow:inset 0 0 0 2px #172041}
.opt{display:flex;gap:12px;padding:14px;border-radius:14px;border:1.5px solid #D3D9E6;background:#FFFFFF;font-size:16px;line-height:1.45;color:#172041;text-align:left;width:100%;cursor:pointer}
.opt .l{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid #B9C0D3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.on{border-color:#172041;box-shadow:inset 0 0 0 1px #172041}
.opt.on .l{background:#172041;border-color:#172041;color:#FFFFFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F5F9; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #172041; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE2EC; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="01-accueil-mobile.html" aria-label="Quitter l'examen" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #172041">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
      </a>
      <p style="margin: 0; font-size: 16px; font-weight: 700">Examen blanc</p>
      <p role="timer" aria-label="Temps restant 27 minutes 42 secondes" style="margin: 0; height: 36px; padding: 0 12px; border-radius: 999px; background: #172041; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5"></path><path d="M9 2h6"></path></svg>
        27:42
      </p>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <p style="margin: 0; font-size: 16px">Question <strong>17</strong> sur 40</p>
      <p style="margin: 0; font-size: 13px; color: #4B5470">16 répondues · 2 marquées</p>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px">
      <span class="cell done"></span><span class="cell done"></span><span class="cell done"></span><span class="cell done"></span><span class="cell flag"></span><span class="cell done"></span><span class="cell done"></span><span class="cell done"></span><span class="cell done"></span><span class="cell done"></span>
      <span class="cell done"></span><span class="cell flag"></span><span class="cell done"></span><span class="cell done"></span><span class="cell done"></span><span class="cell done"></span><span class="cell now"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
    </div>
    <div style="display: flex; gap: 14px; font-size: 12px; color: #4B5470">
      <span style="display: flex; align-items: center; gap: 6px"><span class="cell done" style="width: 12px; height: 12px"></span>Répondue</span>
      <span style="display: flex; align-items: center; gap: 6px"><span class="cell flag" style="width: 12px; height: 12px"></span>À revoir</span>
      <span style="display: flex; align-items: center; gap: 6px"><span class="cell" style="width: 12px; height: 12px"></span>À faire</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700">Que se passe-t-il en cas de surcharge cognitive ?</h1>

    <div role="group" aria-label="Choix de réponse" style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" class="opt" aria-pressed="false"><span class="l">A</span><span style="padding-top: 3px">La mémoire à long terme se vide pour libérer de la place aux nouvelles informations</span></button>
      <button type="button" class="opt" aria-pressed="false"><span class="l">B</span><span style="padding-top: 3px">L'apprenant devient automatiquement plus attentif et mieux concentré</span></button>
      <button type="button" class="opt" aria-pressed="false"><span class="l">C</span><span style="padding-top: 3px">L'apprenant mémorise plus vite parce que sa mémoire est davantage sollicitée</span></button>
      <button type="button" class="opt on" aria-pressed="true"><span class="l">D</span><span style="padding-top: 3px">La tâche dépasse la capacité de la mémoire de travail et l'apprentissage est compromis</span></button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D3D9E6; background: #FFFFFF; color: #172041; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
        Marquer pour revoir
      </button>
      <p style="margin: 0; font-size: 13px; color: #4B5470; text-align: right">Correction à la fin de l'épreuve</p>
    </div>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #DDE2EC; padding: 12px 16px 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #172041; background: #FFFFFF; color: #172041; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      Précédente
    </button>
    <a href="06-resultat-examen-mobile.html" style="height: 52px; border-radius: 12px; background: #172041; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      Suivante
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </div>
</div>
</body>
</html>
