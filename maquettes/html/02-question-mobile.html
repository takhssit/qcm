<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question — parcours — maquette</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F9}
*{box-sizing:border-box}
::selection{background:#FFE45C;color:#172041}
a{color:#172041;text-underline-offset:3px}a:hover{color:#2A3870}
button,a{font-family:inherit}
:focus-visible{outline:3px solid #172041;outline-offset:2px}
.track{height:8px;border-radius:6px;background:#E6EAF2;overflow:hidden}
.stroke{height:8px;border-radius:6px 3px 7px 3px;background-image:linear-gradient(100deg,rgba(255,228,92,.35) 0%,#FFE45C 4%,rgba(255,228,92,.82) 55%,#FFE45C 96%,rgba(255,228,92,.4) 100%)}
.choice{width:100%;min-height:62px;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid #D3D9E6;background:#FFFFFF;color:#172041;font-size:16px;line-height:1.45;cursor:pointer;transition:border-color .18s ease-out,background-color .18s ease-out,color .18s ease-out}
.choice:hover{border-color:#8B93AE}
.choice .letter{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid #B9C0D3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:background-color .18s ease-out,border-color .18s ease-out,color .18s ease-out}
.choice .body{display:flex;flex-direction:column;gap:6px;padding-top:3px}
.choice .mark{background-image:linear-gradient(100deg,rgba(255,228,92,0) .6%,#FFE45C 2.4%,rgba(255,228,92,.85) 8%,rgba(255,228,92,.74) 92%,#FFE45C 97%,rgba(255,228,92,0) 99.4%);background-repeat:no-repeat;background-size:0% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:7px 3px 8px 4px;padding:1px 5px;margin:0 -5px;transition:background-size .75s cubic-bezier(.16,1,.3,1)}
.choice.picked{border-color:#172041;box-shadow:inset 0 0 0 1px #172041}
.choice.picked .letter{background:#172041;border-color:#172041;color:#FFFFFF}
.choice.correct{border-color:#172041;cursor:default}
.choice.correct .mark{background-size:100% 100%}
.choice.correct .letter{background:#FFE45C;border-color:#172041}
.choice.wrong{border-color:#C4283A;color:#A3192B;cursor:default}
.choice.wrong .letter{background:#C4283A;border-color:#C4283A;color:#FFFFFF}
.choice.dim{color:#5B6482;cursor:default}
.choice.dim:hover,.choice.correct:hover{border-color:inherit}
.verdict{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.primary{width:100%;height:52px;border:0;border-radius:12px;background:#172041;color:#FFFFFF;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.primary:disabled{background:#C9CFDD;color:#4B5470;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){.choice .mark,.choice,.choice .letter{transition:none}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F5F9; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #172041; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE2EC; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="01-accueil-mobile.html" style="height: 44px; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 16px; font-weight: 700; margin-left: -6px; padding: 0 6px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        Parcours
      </a>
      <p style="margin: 0; font-size: 15px; color: #4B5470; font-variant-numeric: tabular-nums">Question <strong style="color: #172041">127</strong> / 324</p>
    </div>
    <div class="track" role="progressbar" aria-label="Avancement du parcours" aria-valuemin="0" aria-valuemax="324" aria-valuenow="127"><div class="stroke" style="width: 39%"></div></div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <span style="background: #FFC978; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px">Moyen</span>
      <span style="font-size: 14px; color: #4B5470">Chapitre 3 · Charge cognitive</span>
    </div>

    <h1 style="margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700">Que recommande l'effet d'attention partagée (split-attention) ?</h1>

    <div role="group" aria-label="Choix de réponse" style="display: flex; flex-direction: column; gap: 10px">
      
        <button type="button" class="choice idle" aria-pressed="false">
          <span class="letter">A</span>
          <span class="body">
            <span><span class="mark">Intégrer physiquement le texte explicatif au schéma plutôt que de les présenter séparément</span></span>
            
            
          </span>
        </button>
      
        <button type="button" class="choice picked" aria-pressed="true">
          <span class="letter">B</span>
          <span class="body">
            <span><span class="mark">Faire alterner deux formateurs pendant la séance pour maintenir l'attention</span></span>
            
            
          </span>
        </button>
      
        <button type="button" class="choice idle" aria-pressed="false">
          <span class="letter">C</span>
          <span class="body">
            <span><span class="mark">Présenter le texte et le schéma sur deux pages différentes pour aérer</span></span>
            
            
          </span>
        </button>
      
        <button type="button" class="choice idle" aria-pressed="false">
          <span class="letter">D</span>
          <span class="body">
            <span><span class="mark">Demander aux apprenants de partager leur attention entre deux tâches simultanées pour s'entraîner</span></span>
            
            
          </span>
        </button>
      
    </div>

    
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #DDE2EC; padding: 12px 16px 22px">
    
      <button type="button" class="primary">Valider</button>
    
    
  </div>
</div>
</body>
</html>
